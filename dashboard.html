<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Card Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="constellation-canvas"></canvas>
    <header class="app-header">
        <div class="container">
            <h1 class="app-logo">ProChecker</h1>
            <nav class="app-nav">
                <a href="dashboard.html" class="active">Checker</a>
                <a href="deposit.html">Deposit</a>
                <a href="support.html">Support</a>
            </nav>
            <div class="header-right">
                <div class="balance-display">Balance: <span id="user-balance">$10.00</span></div>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <main class="container page-container">
        <div class="dashboard-grid">
             <section class="card checker-card">
                <h2>✔️ Card Checker (Cost: $0.05)</h2>
                <form id="checker-form">
                    <div class="input-group">
                        <label for="card-number">Card Number</label>
                        <input type="text" id="card-number" placeholder="0000 0000 0000 0000" required>
                    </div>
                    <div class="input-group-row">
                        <div class="input-group">
                            <label for="expiry-date">Expiry (MM/YY)</label>
                            <input type="text" id="expiry-date" placeholder="MM/YY" required>
                        </div>
                        <div class="input-group">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" placeholder="123" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">Check Card</button>
                </form>
                <div id="checker-result" class="result-box"></div>
            </section>

            <section class="card batch-checker-card">
                <h2>🤖 Batch Checker</h2>
                <p>Paste cards below (one per line, e.g., CCN|MM|YY|CVV)</p>
                <textarea id="batch-input" rows="5"></textarea>
                <button id="batch-check-btn" class="btn">Check All</button>
            </section>

            <section class="card live-cards-card">
                <div class="card-header">
                    <h2>Live Cards ✅</h2>
                    <button id="export-live-btn" class="btn export-btn">Export .txt</button>
                </div>
                <ul id="live-cards-list"></ul>
            </section>

            <section class="card dead-cards-card">
                <div class="card-header">
                    <h2>Dead Cards ❌</h2>
                    <button id="export-dead-btn" class="btn export-btn">Export .txt</button>
                </div>
                <ul id="dead-cards-list"></ul>
            </section>
        </div>
    </main>
    <script src="js/background.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
