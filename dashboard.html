<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Card Checker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>💳 User Dashboard</h1>
            <button id="logout-btn" class="btn">Logout</button>
        </div>
    </header>

    <main class="container">
        <div class="dashboard-grid">
            <section class="card stats-card">
                <h2>📊 Stats</h2>
                <div class="stat">
                    <p>Balance:</p>
                    <p id="user-balance">$10.00</p>
                </div>
                <div class="stat">
                    <p>Checks Performed:</p>
                    <p id="checks-performed">0</p>
                </div>
            </section>

            <section class="card checker-card">
                <h2>✔️ Card Checker (Cost: $0.05)</h2>
                <form id="checker-form">
                    <div class="input-group">
                        <label for="card-number">Card Number</label>
                        <input type="text" id="card-number" placeholder="0000 0000 0000 0000" required>
                    </div>
                    <div class="input-group-row">
                        <div class="input-group">
                            <label for="expiry-date">Expiry (MM/YY)</label>
                            <input type="text" id="expiry-date" placeholder="MM/YY" required>
                        </div>
                        <div class="input-group">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" placeholder="123" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">Check Card</button>
                </form>
                <div id="checker-result" class="result-box">
                    <!-- Result will be shown here -->
                </div>
            </section>

            <section class="card deposit-card">
                <h2>💰 Deposit Funds (Crypto)</h2>
                <p>Send BTC to the address below:</p>
                <div class="wallet-address">
                    <code>bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh</code>
                </div>
                <form id="deposit-form">
                    <div class="input-group">
                        <label for="txn-id">Transaction ID</label>
                        <input type="text" id="txn-id" placeholder="Enter your transaction ID" required>
                    </div>
                    <button type="submit" class="btn">Request Deposit</button>
                </form>
                 <p id="deposit-message" class="success-message"></p>
            </section>

            <section class="card transactions-card">
                <h2>📜 Transaction History</h2>
                <ul id="transaction-list">
                    <!-- Transactions will be added here -->
                    <li>Initial Balance: +$10.00</li>
                </ul>
            </section>
        </div>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
