<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Card Checker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <header>
        <div class="container">
            <h1>🔑 Admin Dashboard</h1>
            <button id="logout-btn" class="btn">Logout</button>
        </div>
    </header>

    <main class="container">
        <div class="dashboard-grid">
            <section class="card deposit-requests-card">
                <h2>💰 Pending Deposit Requests</h2>
                <table id="deposit-requests-table">
                    <thead>
                        <tr>
                            <th>Crypto</th>
                            <th>Amount (USD)</th>
                            <th>Transaction ID</th>
                            <th>Screenshot</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Mock data will be populated by JS -->
                    </tbody>
                </table>
            </section>

            <section class="card api-key-card">
                <h2>⚙️ API Key Management (Stripe)</h2>
                <form id="api-key-form">
                    <div class="input-group">
                        <label for="stripe-key">Stripe Secret Key</label>
                        <input type="password" id="stripe-key" placeholder="sk_live_... or sk_test_...">
                    </div>
                    <button type="submit" class="btn">Save Key</button>
                </form>
                <div class="api-status">
                    <p>Current Key:</p>
                    <code id="current-key">sk_test_...1234</code>
                    <button id="check-key-btn" class="btn">Check Status</button>
                    <p id="key-status"></p>
                </div>
            </section>

            <section class="card wallet-management-card">
                <h2>🏦 Wallet Address Management</h2>
                <form id="wallet-form">
                    <div class="input-group">
                        <label for="btc-addr">BTC Address</label>
                        <input type="text" id="btc-addr" name="btc-addr" placeholder="Enter BTC address">
                    </div>
                    <div class="input-group">
                        <label for="eth-addr">ETH Address</label>
                        <input type="text" id="eth-addr" name="eth-addr" placeholder="Enter ETH address">
                    </div>
                    <div class="input-group">
                        <label for="ltc-addr">LTC Address</label>
                        <input type="text" id="ltc-addr" name="ltc-addr" placeholder="Enter LTC address">
                    </div>
                    <div class="input-group">
                        <label for="usdt-addr">USDT (ERC20) Address</label>
                        <input type="text" id="usdt-addr" name="usdt-addr" placeholder="Enter USDT address">
                    </div>
                    <button type="submit" class="btn">Save Addresses</button>
                    <p id="wallet-save-message" class="success-message"></p>
                </form>
            </section>
        </div>
    </main>

    <div id="screenshot-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <p>Transaction Screenshot:</p>
            <img src="https://via.placeholder.com/600x400.png/0d0d0d/00ff41?text=Mock+Transaction" alt="Transaction Screenshot">
        </div>
    </div>

    <script src="js/background.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
