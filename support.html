<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - ProChecker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="constellation-canvas"></canvas>
    <header class="app-header">
        <div class="container">
            <h1 class="app-logo">ProChecker</h1>
            <div class="nav-and-user">
                <nav class="app-nav">
                    <a href="dashboard.html">Checker</a>
                    <a href="deposit.html">Deposit</a>
                    <a href="support.html" class="active">Support</a>
                </nav>
                <div class="header-right">
                    <div class="balance-display">Balance: <span id="user-balance">$0.00</span></div>
                    <button id="logout-btn" class="btn btn-secondary">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container page-container">
        <div class="support-grid">
            <section class="card existing-tickets">
                <h2>Your Tickets</h2>
                <div id="user-ticket-list">
                    <!-- User's tickets will be listed here -->
                </div>
                <button id="new-ticket-btn" class="btn">Create New Ticket</button>
            </section>
            <section class="card ticket-view">
                <div id="new-ticket-view">
                    <h2>Create New Ticket</h2>
                    <form id="support-ticket-form">
                        <div class="input-group">
                            <label for="ticket-subject">Subject</label>
                            <input type="text" id="ticket-subject" placeholder="e.g., Deposit Issue" required>
                        </div>
                        <div class="input-group">
                            <label for="ticket-message">Message</label>
                            <textarea id="ticket-message" rows="4" placeholder="Describe your issue in detail..." required></textarea>
                        </div>
                        <button type="submit" class="btn">Submit Ticket</button>
                    </form>
                    <p id="ticket-success-message" class="success-message"></p>
                </div>
                <div id="conversation-view" class="hidden">
                    <h2 id="convo-subject"></h2>
                    <div id="convo-messages">
                        <!-- Conversation messages will be rendered here -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="js/background.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
