<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - ProChecker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="constellation-canvas"></canvas>
    <header class="app-header">
        <div class="container">
            <h1 class="app-logo">ProChecker</h1>
            <nav class="app-nav">
                <a href="dashboard.html">Checker</a>
                <a href="deposit.html" class="active">Deposit</a>
                <a href="support.html">Support</a>
            </nav>
            <div class="header-right">
                <div class="balance-display">Balance: <span id="user-balance">$0.00</span></div>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <main class="container page-container">
        <section class="card deposit-card">
            <h2>💰 Deposit Funds</h2>
            <div class="crypto-tabs">
                <button class="tab-btn active" data-crypto="btc"><i class="fa-brands fa-btc"></i> BTC</button>
                <button class="tab-btn" data-crypto="eth"><i class="fa-brands fa-ethereum"></i> ETH</button>
                <button class="tab-btn" data-crypto="ltc"><i class="fa-brands fa-litecoin-sign"></i> LTC</button>
                <button class="tab-btn" data-crypto="usdt"><i class="fa-solid fa-dollar-sign"></i> USDT</button>
            </div>
            <div id="crypto-info">
                <div id="btc-info" class="crypto-content active">
                    <p>Send BTC to:</p>
                    <div class="wallet-address"><code id="btc-address">...</code></div>
                </div>
                <div id="eth-info" class="crypto-content">
                     <p>Send ETH to:</p>
                    <div class="wallet-address"><code id="eth-address">...</code></div>
                </div>
                <div id="ltc-info" class="crypto-content">
                     <p>Send LTC to:</p>
                    <div class="wallet-address"><code id="ltc-address">...</code></div>
                </div>
                <div id="usdt-info" class="crypto-content">
                     <p>Send USDT to:</p>
                    <div class="wallet-address"><code id="usdt-address">...</code></div>
                </div>
            </div>
            <div id="qrcode-container" style="margin: 20px auto; text-align: center;"></div>
            <form id="deposit-form">
                <div class="input-group">
                    <label for="deposit-amount">Amount (USD)</label>
                    <input type="number" id="deposit-amount" placeholder="50.00" required>
                </div>
                <div class="input-group">
                    <label for="txn-id">Transaction ID / Hash</label>
                    <input type="text" id="txn-id" required>
                </div>
                <div class="input-group">
                    <label for="txn-screenshot" class="upload-btn-wrapper">
                        <span class="btn">Upload Screenshot 📸</span>
                        <input type="file" id="txn-screenshot" required>
                        <span id="file-chosen">No file chosen</span>
                    </label>
                </div>
                <button type="submit" class="btn">Request Deposit</button>
            </form>
            <p id="deposit-message" class="success-message"></p>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/background.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
